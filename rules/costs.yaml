# PATHWAYS — options shown side by side, chosen by code from category + context.
# Money/time/emotional figures are Practical estimates (author judgment, vary by city);
# they are not quotes or legal facts. A pathway's legal basis is a corpus ref + exact quote.
# `contexts: all` or a list of context ids from routing.yaml.

pathways:
  - id: do_nothing
    name: "Do nothing for now"
    categories: [consumer, wages, contract_payment]
    contexts: all
    money: "₹0"
    time: "None"
    emotional: "Low now; the loss stays"
    risk: "Time limits keep running. Waiting too long can end your claim."

  - id: written_demand
    name: "Ask in writing (WhatsApp, email or letter)"
    categories: [consumer, wages, contract_payment]
    contexts: all
    money: "₹0–₹50"
    time: "1–2 weeks for a reply"
    emotional: "Low to moderate"
    risk: "They may ignore it, but it creates a dated record you will need later."
    how: "State what is owed, from when, and a date by which you expect it. Keep it polite and factual."

  - id: helpline_household
    name: "Talk to the free legal aid helpline / DLSA first"
    categories: [wages]
    contexts: [household_worker, informal_worker, gig_worker, unknown_employer]
    money: "₹0"
    time: "A call or one visit to the district court complex"
    emotional: "Low"
    risk: "Help depends on your district's capacity; follow up if you do not hear back."
    procedure_ref: "PROC:nalsa_helpline"
    law: {ref: "LSAA1987:s12", quote: "an industrial workman"}
    note: "Free legal services are available to listed categories, including \"a woman or a child\" and \"an industrial workman\" [LSAA1987:s12]; NALSA also lists income-based eligibility by state [PROC:nalsa_legal_aid]."

  - id: wages_authority
    name: "Claim before the wages authority (labour office)"
    categories: [wages]
    contexts: [formal_employee, informal_worker, gig_worker, household_worker, unknown_employer]
    money: "₹0–₹500 (travel, copies); Practical estimate"
    time: "Months; the law asks the authority to try to decide within three months"
    emotional: "Moderate: forms, hearings, facing the employer"
    risk: "Which office handles it depends on your state's rules. For household work, coverage itself may be disputed."
    law: {ref: "COW2019:s45", quote: "endeavour shall be made by the authority to decide the claim within a period of three months"}
    note: "The authority can order compensation that \"may extend to ten times of the claim determined\" [COW2019:s45]; that is a maximum, not a promise."

  - id: hr_escalation
    name: "Escalate inside the company (manager, HR, grievance email)"
    categories: [wages]
    contexts: [formal_employee]
    money: "₹0"
    time: "1–3 weeks"
    emotional: "Moderate; may affect the working relationship"
    risk: "Internal processes can stall. Keep everything in writing."

  - id: consumer_helpline
    name: "Register a complaint with the National Consumer Helpline"
    categories: [consumer]
    contexts: all
    money: "₹0"
    time: "Weeks"
    emotional: "Low"
    risk: "The helpline mediates; it cannot force a refund."
    procedure_ref: "PROC:consumer_helpline"

  - id: consumer_commission
    name: "File a complaint before the District Consumer Commission"
    categories: [consumer]
    contexts: all
    money: "Filing fee as prescribed (not in this corpus) + copies; advocate optional"
    time: "Months to years; Practical estimate"
    emotional: "Moderate to high: hearings, follow-ups"
    risk: "Takes time; outcome depends on your evidence."
    law: {ref: "CPA2019:s35", quote: "may be filed electronically"}
    note: "Complaints \"may be filed electronically\" [CPA2019:s35]. The District Commission hears complaints where the value paid \"does not exceed fifty lakh rupees\" [CPJR2021:s3]."

  - id: civil_recovery
    name: "Recover the money through a civil suit (with an advocate)"
    categories: [contract_payment, wages]
    contexts: [freelancer_client, personal_loan, general_contract, household_worker, informal_worker, unknown_employer]
    money: "Court fee (state-specific, not in this corpus) + advocate fees, often ₹10,000+; Practical estimate"
    time: "Often a year or more; Practical estimate"
    emotional: "High"
    risk: "Costly relative to small amounts; outcome uncertain."

  - id: legal_notice
    name: "Send a legal notice (yourself or through an advocate)"
    categories: [consumer, wages, contract_payment]
    contexts: all
    money: "₹0 if you send it; roughly ₹2,000–₹10,000 through an advocate (Practical estimate, varies by city)"
    time: "2–4 weeks including the reply period"
    emotional: "Moderate: it feels formal"
    risk: "It may harden the other side. Anything you write can be used later, so stick to facts."

  - id: lok_adalat
    name: "Settle through a Lok Adalat (via the DLSA)"
    categories: [consumer, wages, contract_payment]
    contexts: all
    money: "₹0"
    time: "Depends on when your DLSA holds one"
    emotional: "Low to moderate: it is a settlement, both sides must agree"
    risk: "Works only if the other side is willing to settle."
    law: {ref: "LSAA1987:s19", quote: "arrive at a compromise or settlement between the parties"}

  - id: hire_advocate
    name: "Hire an advocate for full representation"
    categories: [consumer, wages, contract_payment]
    contexts: all
    money: "Varies widely; often ₹10,000–₹50,000+ (Practical estimate)"
    time: "Depends on the forum"
    emotional: "Lower day-to-day stress; higher cost"
    risk: "Cost may exceed small claims."

# Order in which pathways are shown, per context (others follow in file order).
order:
  household_worker: [written_demand, helpline_household, lok_adalat, wages_authority, legal_notice, civil_recovery, do_nothing]
  informal_worker: [written_demand, helpline_household, wages_authority, lok_adalat, legal_notice, civil_recovery, do_nothing]
  unknown_employer: [written_demand, helpline_household, wages_authority, lok_adalat, legal_notice, civil_recovery, do_nothing]
  formal_employee: [written_demand, hr_escalation, wages_authority, legal_notice, lok_adalat, hire_advocate, do_nothing]
  online_purchase: [written_demand, consumer_helpline, consumer_commission, legal_notice, do_nothing]
